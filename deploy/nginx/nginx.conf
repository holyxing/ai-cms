user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # _archived flag 及静态文件存在性短缓存 (1 分钟), 减轻 -f 检查
    open_file_cache          max=1000 inactive=1m;
    open_file_cache_valid    1m;
    open_file_cache_min_uses 1;
    open_file_cache_errors   on;

    # ============ B5 host-based 域名映射 ============
    # map 文件由后端自动维护: /etc/nginx/conf.d/sites.map
    # 格式: <domain> <slug>;
    # 例:    example.com my-site;
    #        www.example.com my-site;
    # 找不到时 $host_to_slug = "" → 后续 if 拦截
    map $http_host $host_to_slug {
        default "";
        include /etc/nginx/conf.d/sites.map;
    }

    # admin 域判定: localhost / *.localhost / 内网 IP
    # 在 http 块顶层, 避免 location 块内嵌套 if
    map $host $is_admin_host {
        default 0;
        localhost 1;
        ~^.*\.localhost$ 1;
        ~^127\. 1;
        ~^10\. 1;
        ~^192\.168\. 1;
    }

    # $root_action 预先在 http 块计算:
    # 0 = 正常 (映射成功)
    # 1 = admin_redirect (admin 域 + 未映射 + 根路径)
    # 2 = not_found (未映射, 非 admin 根)
    # 3 = archived (归档站)
    # map key 可以包含空字符串, nginx 用 "" 作 key
    # 用 is_admin_host 和 site_slug 拼接, 但 empty string 在 map regex 不接
    # 简化为: site_slug="" 时 map 默认 2, 后续 if 在 location 判 1
    # 这里 map 只输出 0 (映射) 或 2 (未映射) 两个基础状态
    # 1 (admin redirect) 和 3 (archived) 在 location 内 set
    map $host_to_slug $root_action {
        default 0;
        "" 2;
    }

    # P2.10: final_action = is_admin_host + is_mapped
    # 0: 映射成功 (公开静态)
    # 1: admin 域未映射 (跳 /admin/)
    # 2: 未映射 (404)
    # 3: 归档
    # 预先算: is_admin_host AND host_to_slug="" → 1
    # 用 map (http 块), 在 location 内只 set 3 (archived)
    # map key 不能含 empty, 用复合字符串: is_admin_host + "/" + slug
    # key="1/" 表示 admin 域 + 未映射, 其他都已映射
    map "$is_admin_host$host_to_slug" $admin_redirect {
        default 0;
        ~^1$ 1;       # admin 域 + slug 空 (key="1")
        ~^1hydata$ 0;  # P2.10.1: hydata.localhost 已映射, 不跳 admin
        ~^1demo-site$ 0;  # P2.10.1: demo-site.localhost 已映射, 不跳 admin
    }

    # ============ 上游服务 ============
    # P2.9 D1: 修容器重启后 DNS 缓存 bug
    # 背景: nginx 启动时解析 api:8000 → 172.x.x.x, 重启容器后 IP 变, nginx 仍调旧 IP → 502
    # 修: 加 resolver + 用变量 host 访问 (变量不缓存, 每次按 resolver 重新解析)
    # 变量名注意: 不用 $upstream 名, 避免与 upstream block 重名
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # upstream 块 (保留用于明确 upstream 配置; 但 location 改用变量法)
    upstream api_upstream {
        server api:8000;
    }
    upstream admin_dev_upstream {
        server admin:5173;
    }
    upstream minio_upstream {
        server minio:9000;
    }

    # map 变量 (代替 set, http 块允许)
    # 每次请求重走 map, 不缓存
    map $http_host $api_host {
        default api;
    }
    map $http_host $admin_host {
        default admin;
    }
    map $http_host $minio_host {
        default minio;
    }

    # ============ 主入口（80 端口） ============
    server {
        listen 80;
        server_name _;

        # 客户端上传大小限制（媒体）
        client_max_body_size 100M;

        # ---- 根路径重定向 (B5: 区分 admin / 已映射 host / 未映射) ----
        # 1) site_slug 非空 (已映射 host) → 静态首页
        # 2) site_slug 空 + host 是 admin 域 (localhost, *.localhost) → 302 → /admin/
        # 3) site_slug 空 + host 是其他 → 404
        # 实现: 用 location / catch-all, 内部 $is_admin_host 变量判定

        # ---- 后台管理（dev 模式代理到 Vite） ----
        # Vite base = '/', nginx 负责加 /admin 前缀
        # 1. /admin/ 入口: rewrite 去掉 /admin,代理到 vite /
        # 2. /admin 资源 (/src/main.tsx 等): 同上
        # 3. SPA 路由 (/admin/login 等): vite 自己 fallback
        location /admin/ {
            # 去掉 /admin 前缀,转发给 vite
            rewrite ^/admin(/.*)?$ $1 break;
            proxy_pass http://$admin_host:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Vite HMR WebSocket 升级
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # WS 长连接超时
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }

        # /admin (无尾斜杠) 重定向到 /admin/
        location = /admin {
            return 301 /admin/;
        }

        # ---- Vite dev 内部资源（HTML 里被硬编码的绝对路径引用） ----
        # vite 在 dev 模式下 HTML 里会注入 /@vite/client, /@react-refresh 等
        # 这些路径不带 /admin 前缀, 走这个 location 直接代理到 vite
        # 匹配: /@xxx 和 /@xxx/ (有或无尾斜杠)
        # P3.6.5: 加 /src/ /node_modules/ 也代理 (vite dev 硬编码)
        location ~ ^/(src|node_modules)/.*$ {
            proxy_pass http://$admin_host:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location ~ ^/@(vite|react-refresh|id)(/.*)?$ {
            proxy_pass http://$admin_host:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # vite 自己的 /node_modules/.vite/deps/ 路径
        location ^~ /node_modules {
            proxy_pass http://$admin_host:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # favicon 在 public/ 下, 直接代理
        location = /favicon.svg {
            proxy_pass http://$admin_host:5173/favicon.svg;
            proxy_http_version 1.1;
        }

        # ---- SPA 路由 fallback（登录/注册等非 /admin 路径） ----
        # 匹配:不以 /api、/sites、/media、/admin、/healthz、/@、/node_modules 开头,不带扩展名的请求
        # 重定向到 /admin/xxx,让 Vite 处理
        # B5: 已映射域名 ($host_to_slug != "") 走 location / 取静态产物
        # 解决: 直接在 location / 加 if 兼容 (前面已经加了 host_to_slug 的 host-based)
        # 这里只处理 admin 域
        # P3.6.2 fix: 排除 .html/.xml 等带扩展名路径, 否则 /solution/solution-finance.html 这种静态文件会被错误地 rewrite 到 / (走 location / fallback /index.html)
        location ~ ^/(?!api|sites|media|admin|healthz|@|node_modules|favicon\.svg)[a-zA-Z0-9_-]+(/[^.]*)?$ {
            if ($host_to_slug = "") {
                # 仅 admin 域 / 未映射域走 SPA fallback → /admin/xxx
                return 302 $scheme://$http_host/admin$request_uri;
            }
            # 已映射域名: 走静态服务
            # P3.6.2 fix: 之前用 rewrite ^ / last 把所有路径都改到 /, 导致
            # /solution/solution-finance.html → / → /index.html (错返 home 内容)
            # 现 try_files 包含 $uri/index.html 显式走目录 index, 避免被改到 /
            root /var/www/sites/$host_to_slug/public;
            try_files $uri $uri/index.html /index.html =404;
        }

        # B5 host-based 静态服务 (named location, 由 SPA fallback 内部 redirect)
        # named location 不能用 alias, 用 root + $uri 自动拼
        # 实际: 传过来的 $uri 已经是 path 的一部分
        location @b5_static {
            root /var/www/sites/$host_to_slug/public;
            try_files $uri $uri/ $uri/index.html /index.html =404;
        }

        # ---- API ----
        location /api/ {
            proxy_pass http://$api_host:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE 需要禁用缓冲
            proxy_buffering off;
            proxy_cache off;
        }

        # ---- 公开静态站点（SSG 产物） ----
        # B5 简化版: /sites/{slug}/ 映射 /var/www/sites/{slug}/public/
        # location 头用 named capture: nginx 自动注入 $host_to_slug, $site_path
        # 不加 try_files, 让 alias 自动用文件系统查找
        # F3: 归档站点返回 410 Gone
        location ~ ^/sites/(?<site_slug>[^/]+)/(?<site_path>.*)$ {
            if (-f /var/www/sites/_archived/$site_slug) {
                return 410 "Site archived (410 Gone)";
            }
            alias /var/www/sites/$site_slug/public/$site_path;
            index index.html;
        }

        # B5 P2.5 host-based 域名映射: $host -> $host_to_slug
        # 优先级: 具体 location (/api/, /admin/, /media/, /sites/, /@xxx, /node_modules, /favicon.svg, /healthz) 先匹配
        # 兑底: location / 只在上述不匹配时生效
        # 没找到对应域名 ($host_to_slug="") -> 404 (除了 admin 域根路径)
        # F3: 归档站点 410
        # nginx 限制: location 内不能嵌套 if, 用 map (set 初始) + flat if (覆盖)
        # $root_action: 0=映射成功, 1=admin_redirect, 2=not_found, 3=archived
        # $host_to_slug="" 初始 root_action=2 (map)
        # 1 (admin_redirect): admin 域 + 未映射 + $uri="/"
        # 3 (archived): -f flag
        location / {
            set $final_action $root_action;

            # 归档覆盖 (优先于其他)
            if (-f /var/www/sites/_archived/$host_to_slug) {
                set $final_action 3;
            }
            # admin 域未映射 redirect (P2.10 改: map 预算)
            if ($admin_redirect = 1) {
                set $final_action 1;
            }

            if ($final_action = 1) {
                return 302 /admin/;
            }
            if ($final_action = 2) {
                return 404 "Unknown host: $host (no domain mapped)";
                add_header Content-Type text/plain;
            }
            if ($final_action = 3) {
                return 410 "Site archived (410 Gone)";
                add_header Content-Type text/plain;
            }

            # 0: 正常公开站 (host-based)
            root /var/www/sites/$host_to_slug/public;
            try_files $uri $uri/ $uri/index.html /index.html =404;
        }

        # ---- 媒体（MinIO 公开 bucket） ----
        # 直接代理到 MinIO, 改 Host 为 minio:9000 以匹配 presigned 签名
        location /media/ {
            proxy_pass http://$minio_host:9000;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            client_max_body_size 100M;
        }

        # ---- 健康检查 ----
        location /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
