# 霍因科技静态站 — 远程 Nginx 配置
# 部署路径: /etc/nginx/sites-available/huoyinkeji
# 站点根目录: /var/www/sites/huoyinkeji/public/
#
# 安装:
#   sudo bash deploy/scripts/setup-remote-nginx.sh
# 或手动:
#   sudo cp deploy/nginx/remote/huoyinkeji.conf /etc/nginx/sites-available/huoyinkeji
#   sudo ln -sf /etc/nginx/sites-available/huoyinkeji /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 可按实际域名修改；暂用 IP 访问时用 default_server
    server_name 172.16.17.61 _;

    root /var/www/sites/huoyinkeji/public;
    index index.html;

    charset utf-8;
    client_max_body_size 20M;

    # ZIP 导入遗留英文路径 → 301 跳转到实际 slug（兼容旧书签/缓存 JS）
    location ~ ^/product-center/product-(.+)\.html$ {
        return 301 /chanpinzhongxin/$1.html;
    }
    location ~ ^/solutions/solution-trusted-space\.html$ {
        return 301 /jiejuefangan/chanpinjiejuefangan/kexinshujukongjian.html;
    }
    location ~ ^/solutions/solution-classification\.html$ {
        return 301 /jiejuefangan/chanpinjiejuefangan/fenleifenji.html;
    }
    location ~ ^/solutions/solution-security-governance\.html$ {
        return 301 /jiejuefangan/chanpinjiejuefangan/shujuanquanzhili.html;
    }
    location = /solutions/industry-energy.html {
        return 301 /jiejuefangan/hangyejiejuefangan/nengyuan.html;
    }
    location = /solutions/industry-government.html {
        return 301 /jiejuefangan/hangyejiejuefangan/zhengfu.html;
    }
    location = /solutions/industry-medical.html {
        return 301 /jiejuefangan/hangyejiejuefangan/yiliao.html;
    }
    location = /solutions/industry-manufacturing.html {
        return 301 /jiejuefangan/hangyejiejuefangan/zhizao.html;
    }
    location = /solutions/industry-central-enterprise.html {
        return 301 /jiejuefangan/hangyejiejuefangan/guoyangqi.html;
    }
    location = /solutions/industry-education.html {
        return 301 /jiejuefangan/hangyejiejuefangan/jiaoyu.html;
    }
    location ~ ^/about/about-contact\.html$ {
        return 301 /guanyuwomen/lianxiwomen.html;
    }

    # 静态资源长缓存
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML / 目录页：支持 xinwenzixun/hangyedongtai/index.html 这类结构
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /favicon.ico {
        try_files /favicon.ico =404;
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
    }

    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    access_log /var/log/nginx/huoyinkeji.access.log;
    error_log  /var/log/nginx/huoyinkeji.error.log;
}
